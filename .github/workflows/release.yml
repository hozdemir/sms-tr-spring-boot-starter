name: Release

on:
  push:
    tags: ['v*']
  # Manual run: imports the key, signs and bundles everything, uploads nothing.
  # Use it to check the GPG and Central secrets before tagging.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Set release version
        run: |
          if [ "$DRY_RUN" = true ]; then VERSION=0.0.0-dryrun; else VERSION="${GITHUB_REF_NAME#v}"; fi
          ./mvnw -B versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      - name: Sign, bundle and publish
        run: ./mvnw -B -Prelease deploy -DskipUpload="$DRY_RUN"
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Check a signature against the public key
        run: |
          gpg --keyserver hkps://keyserver.ubuntu.com --recv-keys "$(gpg --list-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')"
          JAR=$(find target/central-staging -name 'sms-tr-core-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          gpg --verify "$JAR.asc" "$JAR"
